<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <meta
    http-equiv="refresh"
    content="60"
  >

  <title>
    ボートレースAI 最新予想
  </title>

  <style>

    :root {
      color-scheme: light dark;

      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #111827;
      --muted: #667085;
      --line: #e5e7eb;
      --live-bg: #dcfce7;
      --live-text: #166534;
      --morning-bg: #e0e7ff;
      --morning-text: #3730a3;
      --chip: #f3f4f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Noto Sans JP",
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 16px 12px 48px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;

      margin:
        -16px
        -12px
        14px;

      padding:
        14px
        16px
        12px;

      background: var(--bg);

      border-bottom:
        1px solid
        var(--line);
    }

    h1 {
      margin: 0;

      font-size: 22px;
      line-height: 1.3;
    }

    .meta {
      margin-top: 6px;

      display: flex;
      gap: 10px;
      flex-wrap: wrap;

      color: var(--muted);

      font-size: 13px;
    }

    .notice {
      padding: 10px 12px;
      margin-bottom: 12px;

      border-radius: 10px;

      background: var(--card);

      color: var(--muted);

      font-size: 13px;
      line-height: 1.55;
    }

    .race-card {
      background: var(--card);

      border:
        1px solid
        var(--line);

      border-radius: 14px;

      padding: 14px;
      margin-bottom: 12px;

      box-shadow:
        0 1px 3px
        rgba(0,0,0,.04);
    }

    .race-head {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 12px;
    }

    .race-order {
      width: 28px;
      height: 28px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: var(--chip);

      font-weight: 700;

      flex: 0 0 auto;
    }

    .race-main {
      min-width: 0;
      flex: 1;
    }

    .deadline {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
    }

    .race-name {
      margin-top: 3px;

      font-size: 16px;
      font-weight: 700;
    }

    .badge {
      flex: 0 0 auto;

      border-radius: 999px;

      padding: 6px 10px;

      font-size: 13px;
      font-weight: 800;
    }

    .badge.live {
      background: var(--live-bg);
      color: var(--live-text);
    }

    .badge.morning {
      background: var(--morning-bg);
      color: var(--morning-text);
    }

    .top-picks {
      display: grid;
      gap: 6px;
    }

    .pick {
      display: grid;

      grid-template-columns:
        28px
        1fr
        auto;

      align-items: center;

      gap: 6px;

      padding: 8px 10px;

      border-radius: 10px;

      background: var(--chip);
    }

    .mark {
      font-size: 18px;
      font-weight: 900;
    }

    .pick-name {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .score {
      font-weight: 800;

      font-variant-numeric:
        tabular-nums;
    }

    details {
      margin-top: 10px;
    }

    summary {
      cursor: pointer;

      font-weight: 700;

      color: var(--muted);
    }

    .scores {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 8px;
    }

    .chip {
      padding: 6px 9px;

      border-radius: 999px;

      background: var(--chip);

      font-size: 13px;

      font-variant-numeric:
        tabular-nums;
    }

    .formation {
      margin-top: 12px;
      padding-top: 12px;

      border-top:
        1px solid
        var(--line);
    }

    .formation-title {
      font-weight: 800;
      margin-bottom: 8px;
    }

    .formation-grid {
      display: grid;
      gap: 4px;

      font-size: 14px;
    }

    .combos {
      margin-top: 8px;

      font-size: 13px;
      line-height: 1.6;

      overflow-wrap: anywhere;

      color: var(--muted);
    }

    .unavailable {
      color: var(--muted);
    }

    .empty {
      background: var(--card);

      border-radius: 14px;

      padding: 24px;

      text-align: center;

      color: var(--muted);
    }

    footer {
      margin-top: 18px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.6;
    }

    @media (prefers-color-scheme: dark) {

      :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #f3f4f6;
        --muted: #a8b0bd;
        --line: #2a3039;
        --chip: #222833;

        --live-bg: #153b25;
        --live-text: #86efac;

        --morning-bg: #22285a;
        --morning-text: #c7d2fe;
      }

    }

  
/* family-navigation-v5-unified */

  box-sizing: border-box !important;
}

.family-nav a {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  min-width: 0 !important;
  min-height: 44px !important;
  padding: 11px 5px !important;
  border: 0 !important;
  border-radius: 10px !important;
  background: transparent !important;
  color: var(--text) !important;
  text-align: center !important;
  text-decoration: none !important;
  font-size: 13px !important;
  font-weight: 800 !important;
  line-height: 1.25 !important;
  -webkit-tap-highlight-color: transparent;
}

.family-nav a:link,
.family-nav a:visited {
  color: var(--text) !important;
  text-decoration: none !important;
}

.family-nav a.active,
.family-nav a.active:link,
.family-nav a.active:visited {
  background: #2563eb !important;
  color: #ffffff !important;
  text-decoration: none !important;
}

.wrap {
  width: min(920px, 100%) !important;
  margin: 0 auto !important;
  padding: 16px 12px 48px !important;
}

header {
  margin-bottom: 12px !important;
}

header h1 {
  margin: 0 !important;
  font-size: 23px !important;
  font-weight: 800 !important;
  line-height: 1.35 !important;
  letter-spacing: 0 !important;
}

header .meta {
  display: flex !important;
  flex-wrap: wrap !important;
  gap: 4px 10px !important;
  margin-top: 6px !important;
  color: var(--muted) !important;

  line-height: 1.5 !important;
}

.notice {
  margin: 0 0 14px 0 !important;
  padding: 14px !important;
  border: 1px solid var(--line) !important;
  border-radius: 14px !important;
  background: var(--card) !important;
  color: var(--muted) !important;
  font-size: 13px !important;
  line-height: 1.7 !important;
  box-sizing: border-box !important;
}

@media (prefers-color-scheme: dark) {

  .family-nav a.active,
  .family-nav a.active:link,
  .family-nav a.active:visited {
    background: #3b82f6 !important;
    color: #ffffff !important;
  }

}

@media (max-width: 560px) {

  .family-nav {
    gap: 4px !important;
    padding: 5px !important;
  }

  .family-nav a {
    min-height: 42px !important;
    padding: 9px 2px !important;
    font-size: 11px !important;
  }

  header h1 {
    font-size: 23px !important;
  }

  header .meta {
    font-size: 13px !important;
  }

  .notice {
    padding: 13px !important;
    font-size: 13px !important;
  }

}

</style>
